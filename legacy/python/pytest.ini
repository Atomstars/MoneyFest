[pytest]
markers =
    llm: tests that make real LLM API calls (excluded by default; run with -m llm)

# LLM tests are excluded from the default run. They cost real quota -- Groq's free
# tier allows roughly one full golden run per day -- so `pytest` must stay free and
# offline-safe regardless of whether a provider key happens to be set in the
# environment. Run the golden set deliberately:
#     pytest -m llm -s tests/test_golden.py
addopts = -m "not llm"
