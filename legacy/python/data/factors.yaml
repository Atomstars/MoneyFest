# Canonical factor registry -- the CLOSED vocabulary.
# =====================================================================
# FIRST DRAFT FOR HUMAN REVIEW. These seeds are curator starting points,
# not ratified truth. Review keywords and series_source before production.
# =====================================================================
# The agent (Phase 2) can ONLY ever reference a factor listed here.
# kind: series  -> fetched daily (Tier-2), an observation becomes evidence
#                  when |move| >= that factor's own 60d 1-sigma.
# kind: event   -> matched by the Tier-3 keyword tagger on ingested news.
# series_source is advisory in Phase 1 (Tier-2 ingestor uses yfinance symbols
# where available; event factors have null series_source).

version: factors-v1-draft

factors:
  - id: CRUDE_BRENT
    name: Brent Crude Oil
    kind: series
    series_source: "BZ=F"
    unit: USD/bbl
    keywords: [brent, crude, crude oil, oil price, opec, wti]
    description: Global crude oil benchmark; input cost for many manufacturers.

  - id: USDINR
    name: USD/INR Exchange Rate
    kind: series
    series_source: "INR=X"
    unit: INR per USD
    keywords: [rupee, usdinr, dollar-rupee, currency, forex, inr depreciation, rupee weakness]
    description: Rupee vs US dollar; drives exporter revenue and importer cost.

  - id: NIFTY50
    name: NIFTY 50 Index
    kind: series
    series_source: "^NSEI"
    unit: index
    keywords: [nifty, nifty50, benchmark, broad market, sensex]
    description: Broad-market benchmark; the beta reference for the gate.

  - id: RBI_REPO
