# Ticker -> sector-template mapping (hand-maintained).
# =====================================================================
# MAINTAINED BY HAND. Onboarding assigns a stock's sector by looking up its
# NSE ticker here. Sector values must match a key in data/sector_templates.yaml.
# Unmapped tickers onboard with sector_id=NULL -> empty exposure profile ->
# only the event trigger produces rich output (this is correct behaviour).
# =====================================================================
