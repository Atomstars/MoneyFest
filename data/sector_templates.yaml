# Sector transmission templates -- hand-curated once per sector.
# =====================================================================
# FIRST DRAFT FOR HUMAN REVIEW. Each edge below is a curator's starting
# hypothesis, not a ratified position. Review direction signs and strength
# before relying on any output.
# =====================================================================
# Each edge:
#   factor_id      -- must exist in data/factors.yaml (closed vocabulary)
#   channel        -- one of: input_cost, output_price, revenue_currency,
#                     cost_currency, funding_cost, demand_driver, regulatory,
#                     supply_chain, competitive
#   pnl_line       -- free text (gross_margin, revenue, nim, ebitda, ...)
#   direction      -- "+1" | "-1" | "COND"   (effect of a factor RISE on the stock)
#   condition_note -- required when direction == COND
#   strength       -- core | secondary
#   chain_template_text -- one plain-language sentence; {dir}/{inv}/{impact}
#                          are interpolated at render time from the factor's move.
#
# Direction convention: +1 means "factor up => good for the stock" and
# -1 means "factor up => bad for the stock". Resolved per stock at render time
# as sign(factor_move) x direction (Constraint 7).

version: sector-templates-v1-draft

sectors:

  IT_SERVICES:
    - factor_id: USDINR
      channel: revenue_currency
      pnl_line: revenue
      direction: "+1"
      strength: core
      chain_template_text: "INR {dir} vs USD -> USD revenues convert to more INR -> revenue/margin {impact}."
    - factor_id: IT_DEMAND_US
      channel: demand_driver
      pnl_line: revenue
      direction: "+1"
      strength: core
      chain_template_text: "US tech-spend {dir} -> deal wins and billing {dir} -> revenue {impact}."
    - factor_id: US_FED
      channel: demand_driver
      pnl_line: revenue
      direction: COND
      condition_note: "Higher US rates can slow discretionary tech budgets with a lag; effect is indirect."
      strength: secondary
      chain_template_text: "US rate {dir} -> client budget caution -> discretionary demand {impact}."

  BANKS_PRIVATE:
    - factor_id: RBI_REPO
      channel: funding_cost
      pnl_line: nim
      direction: COND
      condition_note: "Hike: near-term NIM expansion if assets reprice faster than deposits; sustained hikes drag credit growth."
