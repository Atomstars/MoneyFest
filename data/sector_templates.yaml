    - factor_id: IN_10Y
      channel: funding_cost
      pnl_line: treasury_income
      direction: "-1"
      strength: secondary
      chain_template_text: "10Y yield {dir} -> bond-book mark-to-market {inv} -> treasury income {impact}."
    - factor_id: REGULATORY_RBI
      channel: regulatory
      pnl_line: growth
      direction: "-1"
      strength: core
      chain_template_text: "RBI curb/penalty -> business restriction -> growth/costs {impact}."

  BANKS_PSU:
