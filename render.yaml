services:
  - type: web
    name: moneyfest-api
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/Atomstars/MoneyFest
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
