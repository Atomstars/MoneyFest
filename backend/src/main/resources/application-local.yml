spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/moneyfest}
    username: ${DB_USER:moneyfest}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
server:
  tomcat:
    threads:
      max: 20
      min-spare: 2
  servlet:
    session:
      cookie:
        secure: false
