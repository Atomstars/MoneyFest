services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: moneyfest
      POSTGRES_USER: moneyfest
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - moneyfest-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyfest -d moneyfest"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  moneyfest-postgres:
